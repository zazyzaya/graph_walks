[build-system]
requires = ["setuptools", "torch"]
build-backend = "setuptools.build_meta"
[project]
name = "temporal_rw_iking5"
version = "0.0.1"
authors = [
  { name="Isaiah J. King", email="iking5@gwu.edu" },
]
description = "A set of functions for temporally biased random walks in torch"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/zazyzaya/temporal_rw"
Issues = "https://github.com/zazyzaya/temporal_rw/issues"